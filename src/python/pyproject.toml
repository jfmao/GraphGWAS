[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphgwas"
version = "0.1.0"
description = "Graph-native GWAS platform on Neo4j"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "neo4j>=5.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gnn = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "scikit-learn>=1.3",
]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "langchain-anthropic>=0.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
all = [
    "graphgwas[gnn,agent,api,mcp,dev]",
]

[project.scripts]
graphgwas = "graphgwas.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
